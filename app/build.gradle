plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.biketracker.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.biketracker.app'
        minSdk 23
        targetSdk 35
        versionCode 42
        versionName '3.39'
    }


    // Tanda tangan tetap (opsional): aktif hanya kalau KEYSTORE_FILE diisi oleh workflow.
    // Tanpa itu, build memakai kunci debug bawaan seperti sebelumnya.
    def ksPath = System.getenv('KEYSTORE_FILE')
    if (ksPath && file(ksPath).exists()) {
        signingConfigs {
            fixed {
                storeFile file(ksPath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
        buildTypes {
            debug {
                signingConfig signingConfigs.fixed
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}