plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.biketracker.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.biketracker.app'
        minSdk 23
        targetSdk 35
        versionCode 29
        versionName '3.26'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}