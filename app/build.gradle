plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Nomor versi: workflow mengisi VERSION_CODE otomatis (naik tiap build) agar bisa diunggah ulang ke Google Play.
def envVersionCode = System.getenv('VERSION_CODE')
def appVersionCode = (envVersionCode && envVersionCode.isInteger()) ? envVersionCode.toInteger() : 45

// Tanda tangan tetap (opsional): aktif hanya kalau KEYSTORE_FILE diisi oleh workflow.
// Tanpa itu, build memakai kunci debug bawaan (cukup untuk dicoba di HP, TIDAK untuk Google Play).
def ksPath = System.getenv('KEYSTORE_FILE')
def hasKeystore = ksPath && file(ksPath).exists()

android {
    namespace 'com.biketracker.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.biketracker.app'
        minSdk 23
        targetSdk 36
        versionCode appVersionCode
        versionName '3.70'
    }

    if (hasKeystore) {
        signingConfigs {
            fixed {
                storeFile file(ksPath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (hasKeystore) signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasKeystore ? signingConfigs.fixed : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        // Laporan lint tetap dibuat, tetapi temuan lama tidak menggagalkan build.
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources {
            // Metadata Kotlin yang tidak dibutuhkan saat aplikasi berjalan (aplikasi tidak memakai refleksi Kotlin).
            excludes += ['**/*.kotlin_builtins', 'META-INF/*.version']
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
