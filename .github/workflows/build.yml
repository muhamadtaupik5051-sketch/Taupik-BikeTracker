name: Build RideTrack Pro V3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show project files
        run: |
          pwd
          ls -la
          find . -maxdepth 4 -type f | sort

      
      - name: Siapkan keystore tetap (jika ada secret)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ride.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/ride.jks" >> "$GITHUB_ENV"
            echo "Keystore tetap dipakai"
          else
            echo "Secret KEYSTORE_BASE64 kosong, memakai kunci debug bawaan"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --info --console=plain 2>&1 | tee build.log


      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RideTrack-Pro-V3-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
